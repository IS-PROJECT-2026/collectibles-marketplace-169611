<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CurioVault | Antiques & Memorabilia Marketplace</title>
  <link rel="stylesheet" href="css/main-theme.css" />
</head>
<body>

  <!-- Top Navigation -->
<!-- Top Navigation -->
<header class="navbar">
  <div class="nav-container">
    <div class="brand-logo">
      <span class="logo-icon">🏛️</span>
      <span class="logo-text">CurioVault <small>#169611</small></span>
    </div>
    <nav class="nav-links">
      <a href="#catalog">Catalog</a>
      <!-- Updated to point to the consignment portal file -->
      <a href="seller-portal.html">Consignment</a>
    </nav>
  </div>
</header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Discover Rare Antiques & Premier Vintage Collectibles</h1>

      <p>A curated digital exchange for authenticated historical artifacts, rare coins, and vintage memorabilia.</p>
      <a href="#catalog" class="btn btn-primary">Explore Catalog</a>
    </div>
  </section>

  <!-- Catalog & Filter Section -->
  <main id="catalog" class="catalog-section">
    <div class="catalog-header">
      <h2>Curated Collection</h2>
      
      <!-- Filter Controls -->
      <div class="filter-bar">
        <div class="filter-group">
          <label for="category-filter">Category:</label>
          <select id="category-filter">
            <option value="all">All Categories</option>
            <option value="Numismatics">Numismatics (Coins)</option>
            <option value="Horology">Horology (Watches)</option>
            <option value="Sports">Sports Memorabilia</option>
            <option value="Fine Art">Fine Art</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="era-filter">Era:</label>
          <select id="era-filter">
            <option value="all">All Eras</option>
            <option value="Victorian">Victorian Era (1837–1901)</option>
            <option value="Art Deco">Art Deco (1920s–1930s)</option>
            <option value="Mid-Century">Mid-Century (1950s)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Dynamic Item Grid -->
    <div id="item-grid" class="item-grid">
      <!-- JavaScript will populate items here -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 CurioVault — IS-PROJECT-2026 | Admission: 169611</p>
  </footer>

  <script src="js/catalog.js"></script>
</body>
</html>
